<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Units & Dimensions | Formulaverse</title>
<style>
  :root{
    --bg: #16130d;
    --card: #241f16;
    --card-border: #3a3122;
    --text: #f8f4ec;
    --muted: #b3a68f;
    --accent: #e0b94f;
    --accent-soft: rgba(224,185,79,0.14);
    --unit-chip: #f4c869;
    --unit-chip-bg: rgba(244,200,105,0.14);
    --dim-chip: #d9a441;
    --dim-chip-bg: rgba(217,164,65,0.14);
    --pill-bg: #241f16;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .topbar{
    display:flex;
    align-items:center;
    gap:14px;
    padding:18px 20px;
    border-bottom:1px solid var(--card-border);
  }
  .back-btn{
    width:34px;height:34px;border-radius:50%;
    background:var(--pill-bg);
    display:flex;align-items:center;justify-content:center;
    color:var(--text); text-decoration:none; font-size:16px;
    border:1px solid var(--card-border);
  }

  .topbar a{
      text-decoration: none;
      font-size: 1rem;
  }
  .topbar-title{
    font-weight:700; font-size:16px; display:flex; align-items:center; gap:8px;
  }
  .topbar-count{
    margin-left:auto; color:var(--muted); font-size:13px;
  }
  .hero{
    text-align:center; padding: 48px 20px 28px;
  }
  .eyebrow{
    display:inline-block;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 11px;
    font-weight:700;
    letter-spacing: 1.5px;
    margin-bottom: 18px;
  }
  .hero h1{
    font-size: 34px;
    margin: 0 0 12px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .hero p{
    color: var(--muted);
    max-width: 520px;
    margin: 0 auto;
    line-height: 1.5;
    font-size: 15px;
  }
  .search-wrap{
    max-width: 560px;
    margin: 28px auto 22px;
    padding: 0 20px;
  }
  .search-box{
    display:flex; align-items:center; gap:10px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 13px 18px;
  }
  .search-box input{
    background:none; border:none; outline:none;
    color: var(--text); font-size: 15px; width:100%;
  }
  .search-box input::placeholder{ color: var(--muted); }
  .search-icon{ color: var(--muted); }

  .filters{
    display:flex; flex-wrap:wrap; justify-content:center; gap:10px;
    padding: 0 20px 8px;
  }
  .filter-pill{
    border: 1px solid var(--card-border);
    background: var(--pill-bg);
    color: var(--muted);
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s ease;
  }
  .filter-pill:hover{ color: var(--text); }
  .filter-pill.active{
    background: linear-gradient(135deg,#c99a2e,#e0b94f);
    color: #1a1508;
    border-color: transparent;
  }

  .result-count{
    text-align:center; color: var(--muted); font-size: 13px; margin: 18px 0;
  }
  .result-count b{ color: var(--accent); font-weight:700; }

  .grid{
    max-width: 980px;
    margin: 0 auto;
    padding: 0 20px 60px;
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
  @media (max-width: 680px){
    .grid{ grid-template-columns: 1fr; }
    .hero h1{ font-size: 26px; }
  }

  .qcard{
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 20px;
    display:flex;
    flex-direction:column;
    gap: 10px;
  }
  .qcard-top{
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
  }
  .qcard-name{ font-weight:700; font-size: 16px; }
  .symbol-chip{
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid rgba(167,139,250,0.3);
    border-radius: 8px;
    font-size: 12px;
    font-weight:700;
    padding: 3px 9px;
    white-space: nowrap;
  }
  .chip-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .unit-chip{
    background: var(--unit-chip-bg);
    color: var(--unit-chip);
    border-radius: 6px;
    padding: 3px 9px;
    font-size: 12.5px;
    font-weight:600;
    font-family: 'Consolas', monospace;
  }
  .dim-chip{
    background: var(--dim-chip-bg);
    color: var(--dim-chip);
    border-radius: 6px;
    padding: 3px 9px;
    font-size: 12.5px;
    font-weight:600;
    font-family: 'Consolas', monospace;
  }
  .qcard-desc{
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.5;
  }
  .qcard-bottom{
    margin-top: 4px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .cat-tag{
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.5px;
    padding: 4px 10px;
    border-radius: 6px;
  }
  .copy-btn{
    background: var(--pill-bg);
    border: 1px solid var(--card-border);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
  }
  .copy-btn:hover{ color: var(--text); border-color: var(--accent); }
  .copy-btn.copied{ color: #6fbf73; border-color: #6fbf73; }

  .no-results{
    text-align:center; color: var(--muted); padding: 40px 20px; grid-column: 1 / -1;
  }
</style>
</head>
<body>

  <div class="topbar">
    <a href="{% url "index-page" %}" class="back-btn"> < </a>
    <div class="topbar-title">⚖️ Units & Dimensions</div>
    <div class="topbar-count" id="totalCount">27 quantities</div>
  </div>

  <div class="hero">
    <span class="eyebrow">REFERENCE</span>
    <h1>Units & Dimensions</h1>
    <p>Every quantity's SI unit and dimensional formula for JEE & NEET — the base you build every derivation on.</p>
  </div>

  <div class="search-wrap">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search quantities, symbols, units...">
    </div>
  </div>

  <div class="filters" id="filterRow">
    <button class="filter-pill active" data-cat="all">All</button>
    <button class="filter-pill" data-cat="fundamental">Fundamental</button>
    <button class="filter-pill" data-cat="mechanical">Mechanical</button>
    <button class="filter-pill" data-cat="electrical">Electrical</button>
    <button class="filter-pill" data-cat="thermal">Thermal</button>
  </div>

  <div class="result-count"><b id="shownCount">27</b> of <b id="allCount">27</b> quantities</div>

  <div class="grid" id="grid"></div>

<script>
const quantities = [
  // Fundamental
  { name:"Length", symbol:"L", unit:"m", dim:"[L]", desc:"Base measure of spatial extent. Every other mechanical dimension is built from this.", cat:"fundamental" },
  { name:"Mass", symbol:"M", unit:"kg", dim:"[M]", desc:"Base measure of a body's inertia and quantity of matter.", cat:"fundamental" },
  { name:"Time", symbol:"T", unit:"s", dim:"[T]", desc:"Base measure of duration; defined via the caesium-133 transition.", cat:"fundamental" },
  { name:"Electric Current", symbol:"I", unit:"A", dim:"[I]", desc:"Base quantity for rate of flow of electric charge.", cat:"fundamental" },
  { name:"Temperature", symbol:"Θ", unit:"K", dim:"[Θ]", desc:"Base measure of thermal state, independent of the substance.", cat:"fundamental" },
  { name:"Amount of Substance", symbol:"N", unit:"mol", dim:"[N]", desc:"Base quantity counting elementary entities, fixed via the Avogadro constant.", cat:"fundamental" },
  { name:"Luminous Intensity", symbol:"J", unit:"cd", dim:"[J]", desc:"Base measure of light power per solid angle, as perceived by the human eye.", cat:"fundamental" },

  // Mechanical
  { name:"Velocity", symbol:"v", unit:"m/s", dim:"[LT⁻¹]", desc:"Rate of change of displacement with time.", cat:"mechanical" },
  { name:"Acceleration", symbol:"a", unit:"m/s²", dim:"[LT⁻²]", desc:"Rate of change of velocity with time.", cat:"mechanical" },
  { name:"Force", symbol:"F", unit:"N", dim:"[MLT⁻²]", desc:"Push or pull on a mass, equal to rate of change of momentum.", cat:"mechanical" },
  { name:"Work / Energy", symbol:"W", unit:"J", dim:"[ML²T⁻²]", desc:"Force applied over a displacement; also the capacity to do work.", cat:"mechanical" },
  { name:"Power", symbol:"P", unit:"W", dim:"[ML²T⁻³]", desc:"Rate at which work is done or energy is transferred.", cat:"mechanical" },
  { name:"Momentum", symbol:"p", unit:"kg·m/s", dim:"[MLT⁻¹]", desc:"Product of mass and velocity; conserved in isolated systems.", cat:"mechanical" },
  { name:"Pressure", symbol:"P", unit:"Pa", dim:"[ML⁻¹T⁻²]", desc:"Force applied per unit area, normal to the surface.", cat:"mechanical" },
  { name:"Density", symbol:"ρ", unit:"kg/m³", dim:"[ML⁻³]", desc:"Mass contained per unit volume of a substance.", cat:"mechanical" },
  { name:"Torque", symbol:"τ", unit:"N·m", dim:"[ML²T⁻²]", desc:"Rotational analogue of force; tendency to cause angular acceleration.", cat:"mechanical" },
  { name:"Angular Velocity", symbol:"ω", unit:"rad/s", dim:"[T⁻¹]", desc:"Rate of change of angular displacement with time.", cat:"mechanical" },
  { name:"Surface Tension", symbol:"γ", unit:"N/m", dim:"[MT⁻²]", desc:"Force per unit length acting along a liquid surface.", cat:"mechanical" },
  { name:"Viscosity", symbol:"η", unit:"Pa·s", dim:"[ML⁻¹T⁻¹]", desc:"Internal resistance of a fluid to flow, per Newton's law of viscosity.", cat:"mechanical" },

  // Electrical
  { name:"Charge", symbol:"Q", unit:"C", dim:"[IT]", desc:"Fundamental property causing electromagnetic interaction; current integrated over time.", cat:"electrical" },
  { name:"Electric Potential", symbol:"V", unit:"V", dim:"[ML²T⁻³I⁻¹]", desc:"Work done per unit charge in moving it between two points.", cat:"electrical" },
  { name:"Resistance", symbol:"R", unit:"Ω", dim:"[ML²T⁻³I⁻²]", desc:"Opposition to current flow, defined by Ohm's law V = IR.", cat:"electrical" },
  { name:"Capacitance", symbol:"C", unit:"F", dim:"[M⁻¹L⁻²T⁴I²]", desc:"Charge stored per unit potential difference across a conductor.", cat:"electrical" },
  { name:"Magnetic Field", symbol:"B", unit:"T", dim:"[MT⁻²I⁻¹]", desc:"Field strength producing force on a moving charge, per the Lorentz force law.", cat:"electrical" },
  { name:"Inductance", symbol:"L", unit:"H", dim:"[ML²T⁻²I⁻²]", desc:"Opposition to change in current, linking induced EMF to rate of current change.", cat:"electrical" },

  // Thermal
  { name:"Heat", symbol:"Q", unit:"J", dim:"[ML²T⁻²]", desc:"Energy transferred between systems due to a temperature difference.", cat:"thermal" },
  { name:"Specific Heat Capacity", symbol:"c", unit:"J/(kg·K)", dim:"[L²T⁻²Θ⁻¹]", desc:"Heat required to raise the temperature of unit mass by one kelvin.", cat:"thermal" },
  { name:"Thermal Conductivity", symbol:"k", unit:"W/(m·K)", dim:"[MLT⁻³Θ⁻¹]", desc:"Rate of heat transfer through a material per unit temperature gradient.", cat:"thermal" },
  { name:"Entropy", symbol:"S", unit:"J/K", dim:"[ML²T⁻²Θ⁻¹]", desc:"Measure of disorder; heat exchanged reversibly per unit temperature.", cat:"thermal" },
];

const grid = document.getElementById('grid');
const shownCountEl = document.getElementById('shownCount');
const allCountEl = document.getElementById('allCount');
const totalCountEl = document.getElementById('totalCount');
const searchInput = document.getElementById('searchInput');
const filterRow = document.getElementById('filterRow');

allCountEl.textContent = quantities.length;
totalCountEl.textContent = quantities.length + " quantities";

let activeCat = 'all';

function render(){
  const q = searchInput.value.trim().toLowerCase();
  const filtered = quantities.filter(item => {
    const matchesCat = activeCat === 'all' || item.cat === activeCat;
    const matchesSearch = !q ||
      item.name.toLowerCase().includes(q) ||
      item.symbol.toLowerCase().includes(q) ||
      item.unit.toLowerCase().includes(q);
    return matchesCat && matchesSearch;
  });

  shownCountEl.textContent = filtered.length;
  grid.innerHTML = '';

  if(filtered.length === 0){
    grid.innerHTML = '<div class="no-results">No quantities match your search.</div>';
    return;
  }

  filtered.forEach(item => {
    const card = document.createElement('div');
    card.className = 'qcard';
    card.innerHTML = `
      <div class="qcard-top">
        <div class="qcard-name">${item.name}</div>
        <div class="symbol-chip">${item.symbol}</div>
      </div>
      <div class="chip-row">
        <div class="unit-chip">${item.unit}</div>
        <div class="dim-chip">${item.dim}</div>
      </div>
      <div class="qcard-desc">${item.desc}</div>
      <div class="qcard-bottom">
        <div class="cat-tag">${item.cat.toUpperCase()}</div>
        <button class="copy-btn" data-copy="${item.name}: ${item.dim}, unit ${item.unit}">Copy</button>
      </div>
    `;
    grid.appendChild(card);
  });

  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      navigator.clipboard.writeText(btn.dataset.copy);
      btn.textContent = 'Copied';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = 'Copy';
        btn.classList.remove('copied');
      }, 1200);
    });
  });
}

filterRow.addEventListener('click', (e) => {
  if(!e.target.classList.contains('filter-pill')) return;
  document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
  e.target.classList.add('active');
  activeCat = e.target.dataset.cat;
  render();
});

searchInput.addEventListener('input', render);

render();
</script>

</body>
</html>
