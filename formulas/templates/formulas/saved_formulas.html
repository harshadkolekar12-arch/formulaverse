<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> SAVED </title>


    <link rel="canonical" href="https://formulaverse.in{{ request.path }}"/>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2098916755752141"
     crossorigin="anonymous"></script>
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-YHLZCEHWF7"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-YHLZCEHWF7');
</script>

    <meta name="description" content="Your saved Physics formulas on FormulaVerse">
<meta property="og:title" content="Saved Formulas — FormulaVerse"/>
<meta property="og:url" content="https://harshadkolekar.pythonanywhere.com/saved"/>
<meta name="keywords" content="{{ formula.title }},
JEE formula, NEET formula, physics formula">

    <style>

body{
    font-family: 'Outfit', sans-serif;
    background: linear-gradient(to right,#0f172a,#1e293b);
    color:white;
    margin:0;
    padding:30px;
}

.container {
    max-width: 92%;
    margin: 0 auto;
    padding: 0 10px;
}


h1{
    color:#38bdf8;
    text-align:center;
    margin-bottom:5px;
}

p{
    text-align:center;
    color: lightpink;
    margin-bottom:40px;
}

ul{
    list-style:none;
    padding:0;
    max-width:900px;
    margin:auto;
}

li{
    background: transparent;
    margin-bottom: 18px;
    padding: 0;
    border-radius: 16px;
    box-shadow: none;
    transition: transform 0.3s ease;
}

li:hover{
    transform: translateY(-3px);
}

a{
    text-decoration: none;
}

.formula-card{
    background: linear-gradient(180deg, rgba(15,23,42,0.9), rgba(23,32,56,0.9));
    border: 1px solid rgba(56, 189, 248, 0.18);
    border-radius: 16px;
    padding: 20px 22px;
    margin: 0;
    box-shadow:
        0 1px 0 rgba(255,255,255,0.04) inset,
        0 10px 30px rgba(0,0,0,0.35);
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
}

.formula-card:hover{
    transform: translateY(-4px);
    border-color: rgba(56, 189, 248, 0.45);
    box-shadow:
        0 0 0 1px rgba(56,189,248,0.15),
        0 18px 40px rgba(0,0,0,0.5),
        0 0 25px rgba(56,189,248,0.15);
}

.formula-title{
    font-size: 1.15rem;
    font-weight: 700;
    color: #38bdf8;
    margin-bottom: 10px;
    letter-spacing: 0.2px;
    transition: color 0.3s ease;
}

.formula-card:hover .formula-title{
    color: #7dd3fc;
}

.formula-form{
    color: #fb923c;
    max-width: 100%;
    max-height: 90px;
    overflow: hidden;
    transform: none;
    font-size: 1.05rem;
    padding: 10px 14px;
    background: rgba(251, 146, 60, 0.06);
    border: 1px solid rgba(251, 146, 60, 0.15);
    border-radius: 10px;
    margin: 6px 0 12px;
    text-align: center;
}

.formula-author{
    font-size: 0.85rem;
    color: #94a3b8;
    margin-top: 6px;
    font-style: italic;
}



.empty-message{
    text-align:center;
    font-size:1.2rem;
    color:#cbd5e1;
}


 .btn-save {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            margin-right: 5px;
            padding: 12px 43px;
            background: transparent;
            border: 1px solid var(--amber);
            border-radius: 8px;
            color: var(--amber);
            font-family: var(--font-display);
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            text-align: center;
        }
        .btn-save:hover {
            background: var(--amber);
            color: #0F172A;
        }

        .formula-card a{
            text-decoration: none;
        }

</style>



     <script>
    MathJax = {
        tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
        svg: { fontCache: 'global' }
    };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
    {% if last_formula %}

     <a href="{% url "single-formula-page" pk=last_formula.id %}">
        <div style="position: fixed; top: 0px; left: 3.7px; color: #fff; font-size: 2.5rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.4)">
            ←
        </div>
    </a>
    {% endif %}


    <h1>🚀 Saved Formulas</h1>
<p>Your Personal FormulaVault</p>

 <div style="display: flex; justify-content: center; padding: 0 12px 16px;">
    <input
        type="text"
        id="searchBar"
        placeholder="🔍 Search your saved formulas...."
        oninput="searchFormulas()"
        style="width:100%; padding:12px 16px; border-radius:25px;
               border:2px solid rgba(180,50,80,0.3);
               background:rgba(255,255,255,0.8);
               font-size:15px; color:#4a0e1a;
               outline:none; box-shadow:0 2px 8px rgba(0,0,0,0.1);">
</div>



{% if savedformulas %}

<ul>
    {% for formula in savedformulas %}


            <li>
                <div class="formula-card">
                    <a href="{% url "single-formula-page" pk=formula.id %}">
                        <div class="formula-title">{{ formula.title }}</div>

                    <div class="formula-form">
                        $$ {{ formula.form }} $$
                    </div>
                    <div class="formula-author">
                        (Given by: {{ formula.given_by }})
                    </div>
                    </a>

                    <form method="POST" action="{% url "unsave-formula" pk=formula.id  %}">
                        {% csrf_token %}
                        <button type="submit" class="btn-save">
                             &#9733; Unsave
                        </button>
                    </form>

                </div>
            </li>


        {% endfor %}


</ul>


{% endif %}

<script>

    function searchFormulas() {
    const query = document.getElementById('searchBar')
                          .value.toLowerCase();
    document.querySelectorAll('.formula-card')
            .forEach(card => {
        const title = card.querySelector('.formula-title')
                          .innerText.toLowerCase();
        card.closest('li').style.display =
            title.includes(query) ? 'block' : 'none';
    });
}

</script>

 </body>
</html>
